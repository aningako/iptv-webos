# Rebuilds guide/guide.json (programme guide for the IPTV Player app) from public XMLTV listings.
# Runs twice a day; the TV downloads the result from raw.githubusercontent.com.
name: Update programme guide

on:
  schedule:
    - cron: '0 22,10 * * *'     # 06:00 and 18:00 Manila time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guide
        run: python3 tools/build_guide.py
      - name: Commit if changed
        run: |
          git config user.name "guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/guide.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update programme guide"
          git push
